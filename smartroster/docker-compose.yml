services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartroster
      POSTGRES_USER: smartroster
      POSTGRES_PASSWORD: smartroster
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartroster"]
      interval: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    ports: ["8002:8002"]

  optimizer-service:
    build: ./optimizer-service
    ports: ["8001:8001"]

  backend:
    build: ./backend-java
    environment:
      DB_URL: jdbc:postgresql://db:5432/smartroster
      DB_USER: smartroster
      DB_PASSWORD: smartroster
      OPTIMIZER_URL: http://optimizer-service:8001
      ML_URL: http://ml-service:8002
    depends_on:
      db: { condition: service_healthy }
      optimizer-service: { condition: service_started }
      ml-service: { condition: service_started }
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  pgdata:
